<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background squircle with dark subtle gradient -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Refined edge border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient inner light spot -->
  <circle cx="24" cy="24" r="16" fill="#38bdf8" fill-opacity="0.08" filter="blur(8px)" />

  <!-- Terminal CLI Prompt Chevron > -->
  <path
    d="M 18 20.5 L 30 32 L 18 43.5"
    stroke="url(#terminalGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Terminal Blinking Cursor Underscore _ -->
  <line
    x1="35.5"
    y1="43.5"
    x2="47"
    y2="43.5"
    stroke="url(#terminalGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />
</svg>
